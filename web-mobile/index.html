  <style>
    /* Cố định: chiều cao = 100vh, chiều rộng = 50vh (1/2 chiều cao) */
    #GameDiv {
      height: 100vh !important;
      width: calc(100vh / 2) !important;
      box-sizing: border-box;
    }
  </style>

  <script>
    // Chạy ngay lập tức, trước khi DOM load
    (function() {
      let isResizing = false;
      
      // Cố định: chiều cao = chiều cao browser, chiều rộng = 1/2 chiều cao
      function resizeGameDiv() {
        if (isResizing) return;
        isResizing = true;
        
        const gameDiv = document.getElementById('GameDiv');
        if (!gameDiv) {
          isResizing = false;
          return;
        }
        
        const viewportHeight = window.innerHeight;
        
        // Chiều cao = chiều cao browser
        const height = viewportHeight;
        // Chiều rộng = 1/2 chiều cao
        const width = height / 2;
        
        // Set kích thước cho GameDiv
        gameDiv.style.width = width + 'px';
        gameDiv.style.height = height + 'px';
        gameDiv.style.maxWidth = '100vw';
        gameDiv.style.maxHeight = '100vh';
        
        // Đảm bảo container và canvas cũng có kích thước đúng
        const container = document.getElementById('Cocos3dGameContainer');
        const canvas = document.getElementById('GameCanvas');
        
        if (container) {
          container.style.width = width + 'px';
          container.style.height = height + 'px';
        }
        
        if (canvas) {
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          // Đảm bảo canvas không bị Cocos Creator override
          canvas.setAttribute('width', width);
          canvas.setAttribute('height', height);
        }
        
        isResizing = false;
      }
      
      // Chạy ngay khi DOM ready
      function initResize() {
        resizeGameDiv();
        
        // Sử dụng requestAnimationFrame để đảm bảo chạy sau khi Cocos Creator render
        function checkAndResize() {
          resizeGameDiv();
          requestAnimationFrame(checkAndResize);
        }
        
        // Chạy liên tục trong 3 giây đầu để đảm bảo override Cocos Creator
        let frameCount = 0;
        const maxFrames = 180; // ~3 giây với 60fps
        function continuousResize() {
          if (frameCount < maxFrames) {
            resizeGameDiv();
            frameCount++;
            requestAnimationFrame(continuousResize);
          }
        }
        requestAnimationFrame(continuousResize);
        
        // Sau đó chỉ check khi có thay đổi
        setTimeout(function() {
          const observer = new MutationObserver(function() {
            resizeGameDiv();
          });
          
          const gameDiv = document.getElementById('GameDiv');
          const canvas = document.getElementById('GameCanvas');
          if (gameDiv) {
            observer.observe(gameDiv, { 
              attributes: true, 
              attributeFilter: ['style', 'width', 'height', 'class'] 
            });
          }
          if (canvas) {
            observer.observe(canvas, { 
              attributes: true, 
              attributeFilter: ['style', 'width', 'height'] 
            });
          }
        }, 3000);
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initResize);
      } else {
        initResize();
      }
      
      // Chạy khi resize
      window.addEventListener('resize', function() {
        resizeGameDiv();
      });
      
      // Chạy khi window load hoàn toàn
      window.addEventListener('load', function() {
        setTimeout(resizeGameDiv, 100);
        setTimeout(resizeGameDiv, 500);
        setTimeout(resizeGameDiv, 1000);
      });
    })();
  </script>

</head>

<body>
  <script>
    function initializeGameAsync() {
      FBInstant.initializeAsync().then(function () {
        console.log("FBInstant.initializeAsync resolved");
        FBInstant.setLoadingProgress(100);
        FBInstant.startGameAsync().then(function () {
          console.log("FBInstant.startGameAsync resolved");
        }).catch(function (error) {
          console.log("FBInstant.startGameAsync exception", error);
          setTimeout(function () {
            initializeGameAsync();
          }, 100);
        });
      }).catch(function (error) {
        console.log("initializeGameAsync exception", error);
        setTimeout(function () {
          initializeGameAsync();
        }, 100);
      });
    }
  </script>

  <script src="https://connect.facebook.net/en_US/fbinstant.7.0.js" async onload="initializeGameAsync()"></script>

  <script src="file-selection.js"></script>
  
  <!-- File Selection Section -->
  <div id="fileSelectionContainer">
    <input type="file" id="fileInput" multiple style="display: none;" />
    <div class="button-container">
        <button id="selectFileBtn" onclick="document.getElementById('fileInput').click()">
            📁 Select Files
        </button>
        <button id="clearSelectionBtn" style="display: none;">
            ❌ Clear Selection
        </button>
    </div>
    <div id="fileSelectionStatus">
        <div id="restoredStateMessage"></div>
        <div id="selectedFilesList"></div>
        <div id="validationMessages"></div>
    </div>
</div>


  <div id="GameDiv" cc_exact_fit_screen="false">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
    </div>
  </div>
