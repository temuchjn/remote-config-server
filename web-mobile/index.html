  <style>
    /* Wrapper cho GameDiv với tỉ lệ 1:2 */
    #GameWrapper {
      height: 100vh;
      width: calc(100vh / 2);
      max-width: 100vw;
      max-height: 100vh;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    
    #GameDiv {
      width: 100%;
      height: 100%;
    }
  </style>

  <script>
    // Set kích thước cho wrapper và delay load Cocos
    (function() {
      function setWrapperSize() {
        const wrapper = document.getElementById('GameWrapper');
        if (!wrapper) return;
        
        const height = window.innerHeight;
        const width = height / 2;
        
        wrapper.style.height = height + 'px';
        wrapper.style.width = width + 'px';
      }
      
      // Delay việc load Cocos Creator
      function delayCocosLoad() {
        if (window.System && window.System.import) {
          const originalImport = window.System.import;
          window.System.import = function(module) {
            return new Promise(function(resolve, reject) {
              setTimeout(function() {
                originalImport.call(window.System, module)
                  .then(resolve)
                  .catch(reject);
              }, 300);
            });
          };
        }
      }
      
      function init() {
        // Set kích thước wrapper ngay
        setWrapperSize();
        
        // Delay load Cocos
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(delayCocosLoad, 100);
          });
        } else {
          setTimeout(delayCocosLoad, 100);
        }
      }
      
      init();
      
      // Update khi resize
      window.addEventListener('resize', setWrapperSize);
    })();
  </script>

</head>

<body>
  <script>
    function initializeGameAsync() {
      FBInstant.initializeAsync().then(function () {
        console.log("FBInstant.initializeAsync resolved");
        FBInstant.setLoadingProgress(100);
        FBInstant.startGameAsync().then(function () {
          console.log("FBInstant.startGameAsync resolved");
        }).catch(function (error) {
          console.log("FBInstant.startGameAsync exception", error);
          setTimeout(function () {
            initializeGameAsync();
          }, 100);
        });
      }).catch(function (error) {
        console.log("initializeGameAsync exception", error);
        setTimeout(function () {
          initializeGameAsync();
        }, 100);
      });
    }
  </script>

  <script src="https://connect.facebook.net/en_US/fbinstant.7.0.js" async onload="initializeGameAsync()"></script>

  <script src="file-selection.js"></script>
  <!-- File Selection Section -->
  <div id="fileSelectionContainer">
    <input type="file" id="fileInput" multiple style="display: none;" />
    <div class="button-container">
        <button id="selectFileBtn" onclick="document.getElementById('fileInput').click()">
            📁 Select Files
        </button>
        <button id="clearSelectionBtn" style="display: none;">
            ❌ Clear Selection
        </button>
    </div>
    <div id="fileSelectionStatus">
        <div id="restoredStateMessage"></div>
        <div id="selectedFilesList"></div>
        <div id="validationMessages"></div>
    </div>
</div>


  <div id="GameWrapper">
    <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
  </div>

</script>
